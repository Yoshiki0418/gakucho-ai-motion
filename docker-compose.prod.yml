# 本番環境用の docker-compose ファイル
version: "3.8"

services:
  nginx:
    image: nginx:latest
    container_name: gakucho_motion_prod_nginx
    restart: always
    ports:
      - "30930:30930"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
  db:
    build:
      context: db
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: "Asia/Tokyo"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: backend
      dockerfile: Dockerfile
    command: ["python3", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8077"]
    ports:
      - "127.0.0.1:8087:8077"
    image: gakucho-ai-motion-backend:prod
    env_file:
      - ./backend/.env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['1']
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=1
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - ENV=prod
      - DB_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - HF_USERNAME=${HF_USERNAME}
      - HF_TOKEN=${HF_TOKEN}
      - PYTHONPATH=/workspace
      - LLM_SYSTEM_PROMPT_PATH=/workspace/app/prompts/system_prompt.txt
      - TTS_MODEL_DIR=/workspace/app/weights/tts/gakucho_ai_v2
      - T2M_SERVER_URL=http://t2m:8099
      - T2M_GENERATE_TIMEOUT=45
      - T2M_DOWNLOAD_TIMEOUT=15
      - TZ=Asia/Tokyo
    depends_on:
      db:
        condition: service_healthy
      t2m:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8077/health').read()"]
      interval: 10s
      timeout: 3s
      retries: 10

  t2m:
    image: gakucho-ai_devcontainer-backend
    container_name: gakucho_motion_t2m
    command: ["python3", "-m", "web_viewer.app"]
    working_dir: /workspace
    volumes:
      - /gpu-server/yamamoto/Custom-T2M-Lab:/workspace
    ports:
      - "127.0.0.1:8100:8099"
    gpus: all
    restart: unless-stopped

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_BASE_URL: https://192.168.29.19:30930
    ports:
      - "127.0.0.1:30213:30212"
    image: gakucho-ai-motion-frontend:prod
    environment:
      - NODE_ENV=production
      - PORT=30212 
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_BASE_URL=https://192.168.29.19:30930
    depends_on:
      - backend
    restart: unless-stopped
