version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HF_USERNAME: ${HF_USERNAME}
        HF_TOKEN: ${HF_TOKEN}
    network_mode: "host"
    gpus: all
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - DB_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@localhost:5432/${POSTGRES_DB}
      - PORT=8078
      - TZ=Asia/Tokyo
      # host ネットワークモードのため t2m 名は解決不可。127.0.0.1 で T2M サーバーへ到達する。
      - T2M_SERVER_URL=http://127.0.0.1:8099