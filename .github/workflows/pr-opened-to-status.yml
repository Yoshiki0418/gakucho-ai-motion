name: Sync Issue status

on:
  create:
  pull_request:
    types: [opened, reopened, synchronize, converted_to_draft, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  issues:
    types: [closed]

permissions:
  issues: write
  pull-requests: read

jobs:
  sync-issue-status:
    if: >-
      (github.event_name != 'create' || github.event.ref_type == 'branch') &&
      (github.event_name == 'create' || github.event_name == 'issues' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    concurrency:
      group: issue-status-${{ github.event.pull_request.head.ref || github.event.ref || github.event.issue.number }}
      cancel-in-progress: false
    env:
      HAS_PROJECT_TOKEN: ${{ secrets.GH_PERSONAL_TOKEN != '' }}
    steps:
      - name: Sync repository Issue labels
        id: labels
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { pull_request, issue, ref } = context.payload;
            const branch = pull_request?.head.ref || ref || '';
            const branchIssue = branch.match(/^[a-z]+\/([1-9]\d*)\/[^/]+$/)?.[1];
            let issueNumber = issue?.number || Number(branchIssue);
            let prNumber = pull_request?.number;
            let status = 'In Progress';

            if (context.eventName === 'create') {
              if (!branchIssue) return;
              // A delayed branch event can arrive after the PR is already in review.
              const { data: open } = await github.rest.pulls.list({
                owner, repo, state: 'open', head: `${owner}:${branch}`, per_page: 1,
              });
              prNumber = open[0]?.number;
            }

            if (prNumber) {
              // Read the current draft/review state on retries, push events and review dismissals.
              // Branches without required reviews can have a null aggregate reviewDecision.
              let cursor = null;
              let approved = false;
              do {
                const { repository } = await github.graphql(
                  `query($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
                    repository(owner: $owner, name: $repo) {
                      pullRequest(number: $number) {
                        state isDraft reviewDecision
                        closingIssuesReferences(first: 100) { nodes { number repository { nameWithOwner } } }
                        latestOpinionatedReviews(first: 100, after: $cursor) {
                          nodes { state } pageInfo { hasNextPage endCursor }
                        }
                      }
                    }
                  }`, { owner, repo, number: prNumber, cursor });
                const pr = repository.pullRequest;
                if (pr.state !== 'OPEN') return;
                if (!issueNumber) {
                  const linked = pr.closingIssuesReferences.nodes.find(
                    item => item.repository.nameWithOwner === `${owner}/${repo}`);
                  if (!linked) return;
                  issueNumber = linked.number;
                }
                if (pr.isDraft || pr.reviewDecision === 'CHANGES_REQUESTED') break;
                if (pr.reviewDecision) {
                  status = pr.reviewDecision === 'APPROVED' ? 'Ready to Merge' : 'Review';
                  break;
                }
                const { nodes, pageInfo } = pr.latestOpinionatedReviews;
                if (nodes.some(review => review.state === 'CHANGES_REQUESTED')) break;
                approved ||= nodes.some(review => review.state === 'APPROVED');
                cursor = pageInfo.hasNextPage ? pageInfo.endCursor : null;
                if (!cursor) status = approved ? 'Ready to Merge' : 'Review';
              } while (cursor);
            }

            const params = { owner, repo, issue_number: issueNumber };
            let { data: current } = await github.rest.issues.get(params);
            if (current.pull_request) return;
            const labels = current.labels.map(label => label.name);
            let target;
            if (context.eventName === 'issues') {
              if (current.state !== 'closed') return;
            } else {
              if (current.state !== 'open' || labels.includes('type:tracking') || labels.includes('type:operation')) return;
              target = status === 'In Progress' ? 'status:in-progress' : 'status:review';
              if (!labels.includes(target)) {
                await github.rest.issues.addLabels({ ...params, labels: [target] });
                // The close handler may have finished cleaning up before the addition.
                ({ data: current } = await github.rest.issues.get(params));
                if (current.state === 'closed') target = undefined;
              }
            }
            for (const { name } of current.labels) {
              if (!name.startsWith('status:') || name === target) continue;
              try {
                await github.rest.issues.removeLabel({ ...params, name });
              } catch (error) {
                // Another handler may already have removed this label.
                if (error.status !== 404) throw error;
              }
            }
            if (target) {
              core.setOutput('issue-id', current.node_id);
              core.setOutput('project-status', status);
            }

      - name: Sync GitHub Project status
        if: env.HAS_PROJECT_TOKEN == 'true' && steps.labels.outputs.issue-id != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PERSONAL_TOKEN }}
          script: |
            const { owner } = context.repo;
            const { user } = await github.graphql(
              `query($owner: String!) {
                user(login: $owner) {
                  projectV2(number: 8) {
                    id
                    field(name: "Status") {
                      ... on ProjectV2SingleSelectField { id options { id name } }
                    }
                  }
                }
              }`, { owner });
            const project = user?.projectV2;
            const field = project?.field;
            const option = field?.options?.find(item => item.name === process.env.PROJECT_STATUS);
            if (!option) throw new Error(`Project #8: missing Status option ${process.env.PROJECT_STATUS}`);
            const { addProjectV2ItemById } = await github.graphql(
              `mutation($project: ID!, $issue: ID!) {
                addProjectV2ItemById(input: {projectId: $project, contentId: $issue}) { item { id } }
              }`, { project: project.id, issue: process.env.ISSUE_ID });
            await github.graphql(
              `mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $project, itemId: $item, fieldId: $field, value: {singleSelectOptionId: $option}
                }) { projectV2Item { id } }
              }`, { project: project.id, item: addProjectV2ItemById.item.id, field: field.id, option: option.id });
        env:
          ISSUE_ID: ${{ steps.labels.outputs.issue-id }}
          PROJECT_STATUS: ${{ steps.labels.outputs.project-status }}
